<style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#203247;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#24577b,#327c89);color:#fff;padding:25px max(18px,calc((100vw - 1060px)/2))}h1{margin:0;font-size:clamp(1.7rem,4vw,2.3rem)}header p{margin:8px 0 0;color:#e8f6f7}main{max-width:1060px;margin:24px auto;padding:0 16px 50px}.card{background:white;border-radius:20px;box-shadow:0 8px 32px #193b5a12;padding:clamp(17px,3vw,30px);margin-bottom:18px}h2{margin-top:7px}.over{font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:.83rem;color:#327c89}.muted{color:#63758a}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:12px 16px;background:#eaf2f7;color:#234a69;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #edaa35;outline-offset:2px}.primary{background:#24759a;color:white}.bar{background:#e9eff4;height:10px;border-radius:100px;overflow:hidden;margin:15px 0 25px}.bar div{background:#23a68a;height:100%}.sentence{background:#eaf3fb;border-radius:15px;padding:26px 15px;text-align:center;font-size:clamp(1.45rem,3.5vw,2.2rem);line-height:1.5;font-weight:600;margin:18px 0}mark{background:#fbe399;padding:3px 6px;border-radius:7px;color:#253449}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.option{min-height:65px;color:white;border:3px solid transparent;padding:11px 8px}.option[data-cat="névmás"]{color:#17202a}.option:focus,.option:hover{border-color:#22374a}.feedback{padding:16px;border-radius:12px;background:#e7f6ed;color:#155b3d;margin-top:16px;line-height:1.5}.feedback.warn{background:#fff1d8;color:#76520c}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:#fffaf0;border:2px solid #e3d6b5;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:105px}.tile:hover{border-color:#357da6}.tile.error{border-color:#d0645f;background:#ffece9}.tile mark{background:#fae3a1}.tag{border-radius:7px;color:white;font-size:.81rem;display:inline-block;padding:5px 9px;align-self:flex-start}.tag[data-cat="névmás"]{color:#17202a}.chip{display:inline-block;background:#e9f1f8;border-radius:100px;padding:9px 13px;font-weight:700;margin-right:8px}.popup{position:fixed;z-index:80;width:min(340px,calc(100vw - 20px));max-height:75vh;overflow:auto;background:white;border:2px solid #a5c3d6;border-radius:14px;padding:12px;box-shadow:0 20px 50px #142b4555}.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.popup-grid button{color:white;font-size:.87rem;min-height:54px}.popup-grid button[data-cat="névmás"]{color:#17202a}.close{display:block;margin-left:auto;margin-bottom:8px;padding:7px 12px}.review{padding:13px 0;border-bottom:1px solid #e6edf4}.review:last-child{border-bottom:0}.score{font-size:3rem;color:#287d92;font-weight:800}.nav{margin-top:15px;display:flex;gap:9px;flex-wrap:wrap}.nav button{background:#e4f0f8}.note{font-size:.91rem;color:#63758a}.hint{border-left:4px solid #3b90b6;padding-left:12px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.list>div{background:#edf4f9;border-radius:12px;padding:15px}@media(max-width:790px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.options{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.tiles,.list{grid-template-columns:1fr}}@media print{header{color:#222;background:white}.nav,.actions{display:none}}
</style></head><body><header><h1>Igenévlabor</h1><p>Öt igenévfajta és három megtévesztő szófaj – felismerés, gyakorlás, tudáspróba</p><div class="nav"><button id="home">Kezdőlap</button><button id="practice">Gyakorlás</button><button id="contrast">Ige vagy főnévi igenév?</button><button id="test">Tudáspróba</button></div></header><main id="app"></main>
<script src="scorm-runtime.js"></script>
<script>
"use strict";
const cats=["ige","főnév","melléknév","főnévi igenév","folyamatos melléknévi igenév","befejezett melléknévi igenév","beálló melléknévi igenév","határozói igenév"];
const colors={"ige":"#8E44AD","főnév":"#007E8C","melléknév":"#E67E22","főnévi igenév":"#27AE60","folyamatos melléknévi igenév":"#22885b","befejezett melléknévi igenév":"#1c7352","beálló melléknévi igenév":"#125a42","határozói igenév":"#3579b2"};
// Az egyes kategóriák első két példája gyakorlás; a további három a tudáspróba része.
// Sor: mondat előtte, kiemelt szó, mondat utána, kategória, indoklás.
const bank=[
["Tegnap sokat ","olvastam",".","ige","Ragozott ige: múlt idő, egyes szám első személy."],
["Most ","játszanak"," a gyerekek.","ige","Ragozott ige: többes szám harmadik személy."],
["Holnap szívesen ","írnánk"," egy történetet.","ige","Feltételes módú, többes szám első személyű ragozott ige."],
["Ti ","ennétek"," valamit?","ige","A feltételes mód jele -né-, a -tek igei személyrag. Nem főnévi igenév."],
["Én most ","ennék"," egy almát.","ige","Feltételes módú ige; a beszélő kívánságát fejezi ki."],
["Az ","olvasó"," csendben leült a fotelbe.","főnév","Itt személyt nevez meg, nem egy másik főnév jelzője."],
["A ","tanuló"," kérdezett a tanártól.","főnév","Itt személyt megnevező főnévként szerepel."],
["A ","dolgozat"," az asztalon van.","főnév","Tárgyat megnevező főnév."],
["A ","festő"," kiállítást rendezett.","főnév","Foglalkozást jelölő főnév."],
["A ","játék"," sokáig tartott.","főnév","Tevékenységet megnevező főnév."],
["A ","piros"," kabát a széken van.","melléknév","Színt, tulajdonságot jelöl."],
["A ","szorgalmas"," diák elkészült.","melléknév","Tulajdonságot megnevező melléknév."],
["A ","vidám"," gyerekek nevetnek.","melléknév","Tulajdonságot jelöl."],
["A ","keskeny"," ösvény az erdőbe vezet.","melléknév","Milyen az ösvény? Melléknév."],
["Egy ","hűvös"," reggelen indultunk.","melléknév","Tulajdonságot jelöl, nem igei eredetű igenév."],
["Szeretek ","olvasni",".","főnévi igenév","Az olvasni a -ni képzős főnévi igenév."],
["Jó lenne ","pihenni"," egy kicsit.","főnévi igenév","A -ni képző jelöli a főnévi igenevet."],
["Most nekem kell ","figyelnem",".","főnévi igenév","A figyelnem személyragos főnévi igenév: -n- képzőváltozat és -em személyrag."],
["Neki kell ","döntenie",".","főnévi igenév","A döntenie személyragos főnévi igenév: a -ni képző és az -e személyrag."],
["Nektek kell ","rajzolnotok"," egy térképet.","főnévi igenév","A rajzolnotok személyragos főnévi igenév, nem feltételes módú ige."],
["Az ","olvasó"," lány a könyvtárban ül.","folyamatos melléknévi igenév","A lány éppen olvas; az -ó képzős alak jelzőként áll."],
["A ","mosolygó"," kisfiú integetett.","folyamatos melléknévi igenév","A mosolygás folyamatban van, -ó képzős igenév."],
["A ","futó"," gyerek elérte a buszt.","folyamatos melléknévi igenév","Folyamatban lévő cselekvés: futó gyerek."],
["A ","csillogó"," hó betakarta az utat.","folyamatos melléknévi igenév","Folyamatban lévő történésre utaló -ó igenév."],
["A ","nevető"," közönség tapsolt.","folyamatos melléknévi igenév","A nevetés folyamatban van; -ő képzős melléknévi igenév."],
["Az ","elolvasott"," könyvet visszavittem.","befejezett melléknévi igenév","Az olvasás már befejeződött; -ott képzős igenév."],
["A ","megírt"," levelet feladtam.","befejezett melléknévi igenév","Az írás befejeződött; -t képzős igenév."],
["A ","bezárt"," ajtó mögül zaj hallatszott.","befejezett melléknévi igenév","A bezárás már megtörtént."],
["Az ","elkészült"," rajzot kitettük.","befejezett melléknévi igenév","Az elkészülés befejeződött; -t képzős alak."],
["A ","megtanult"," verset elmondta.","befejezett melléknévi igenév","A tanulás már megtörtént."],
["A ","megoldandó"," feladat nehéz.","beálló melléknévi igenév","Még meg kell oldani; -andó képző."],
["Az ","elvégzendő"," munkát felírtam.","beálló melléknévi igenév","A cselekvés ezután esedékes; -endő képző."],
["A ","megírandó"," fogalmazás témája érdekes.","beálló melléknévi igenév","A fogalmazást még meg kell írni."],
["Az ","átadandó"," üzenetet leírtam.","beálló melléknévi igenév","Az üzenetet a jövőben kell átadni."],
["A ","megtanulandó"," vers rövid.","beálló melléknévi igenév","A verset még meg kell tanulni; -andó képző."],
["A fiú ","nevetve"," lépett be.","határozói igenév","A -ve képzős alak a cselekvés módját fejezi ki."],
["A gyerekek ","futva"," érkeztek.","határozói igenév","A -va képzős igenév a mozgás módját jelöli."],
["A lány ","mosolyogva"," válaszolt.","határozói igenév","A -va képzőből felismerhető határozói igenév."],
["A padon ","ülve"," olvasott.","határozói igenév","A -ve képző határozói igenevet alkot."],
["Az ablaknál ","állva"," nézte a kertet.","határozói igenév","A -va képzős alak határozói igenév."]
];
const contrast=[
["Nekem most ","ennem"," kell.","főnévi igenév","Az ennem személyragos főnévi igenév; a kell mellett áll."],
["Én most ","ennék"," valamit.","ige","Az ennék feltételes módú, ragozott ige."],
["Neked időben ","menned"," kell.","főnévi igenév","A menned személyragos főnévi igenév."],
["Te szívesen ","mennél"," velünk?","ige","A mennél feltételes módú, ragozott ige."],
["Neki korán kell ","kelnie",".","főnévi igenév","A kelnie személyragos főnévi igenév."],
["Ő később ","kelne"," fel.","ige","A kelne feltételes módú ige."],
["Nekünk is ","ennünk"," kell.","főnévi igenév","Az ennünk személyragos főnévi igenév."],
["Mi most inkább ","ennénk"," valamit.","ige","Az ennénk feltételes módú, többes szám első személyű ige."],
["Nektek előbb ","ennetek"," kell.","főnévi igenév","Az ennetek személyragos főnévi igenév. Ne keverd az ennétek igealakkal!"],
["Ti is ","ennétek"," velünk?","ige","Az ennétek feltételes módú ige."],
["Nekik időben ","érkezniük"," kell.","főnévi igenév","Az érkezniük személyragos főnévi igenév."],
["Ők később ","érkeznének",".","ige","Az érkeznének feltételes módú, ragozott ige."]
];
const key="igenevlabor-prototype-v1",app=document.getElementById("app");
const scorm=window.SzofajSCORM;
let state;
function shuffled(items){let a=items.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}
function textOf(i){const q=bank[i];return esc(q[0])+'<mark>'+esc(q[1])+'</mark>'+esc(q[2])}
function wordOf(i){const q=bank[i];return esc((q[0]+q[1]+q[2]).trim())}
function compact(s){
 return {v:1,m:s.mode,o:s.order||null,i:s.at||0,miss:s.miss||0,
 a:Object.entries(s.answers||{}).map(([i,v])=>[Number(i),cats.indexOf(v)]),
 sc:s.score,chk:s.checked?1:0};
}
function expand(s){
 if(!s||s.v!==1||!["home","practice","contrast","test","done"].includes(s.m))return null;
 return {mode:s.m,order:s.o||null,at:s.i||0,miss:s.miss||0,
 answers:Object.fromEntries((s.a||[]).map(([i,j])=>[i,cats[j]])),
 score:s.sc===undefined?null:s.sc,checked:!!s.chk};
}
function save(){
 if(scorm&&scorm.isConnected){scorm.saveState(compact(state));return}
 try{localStorage.setItem(key,JSON.stringify(state))}catch{}
}
function load(){
 if(scorm&&scorm.isConnected)return expand(scorm.loadState());
 try{return JSON.parse(localStorage.getItem(key))}catch{return null}
}
function indices(first){return shuffled(bank.map((_,i)=>i).filter(i=>first?i%5<2:i%5>=2))}
function canRestart(){return !(scorm&&scorm.isConnected&&state&&state.mode==="done")}
function newPractice(){if(!canRestart())return;state={mode:"practice",order:indices(true),at:0,miss:0,reveal:false,answers:{},score:null};save();render()}
function newContrast(){if(!canRestart())return;state={mode:"contrast",order:shuffled(contrast.map((_,i)=>i)),at:0,miss:0,answers:{},score:null};save();render()}
function newTest(){if(!canRestart())return;state={mode:"test",order:indices(false),at:0,miss:0,reveal:false,answers:{},score:null,checked:false};save();render()}
function start(){state=load();if(!state||!state.mode)state={mode:"home"};if(!(scorm&&scorm.isConnected)&&new URLSearchParams(location.search).get("test")==="1")newTest();else render()}
function render(){if(scorm&&scorm.isConnected&&state.mode==="done")document.querySelectorAll(".nav button").forEach(b=>b.disabled=true);if(state.mode==="home")return home();if(state.mode==="practice")return practice();if(state.mode==="contrast")return drawContrast();if(state.mode==="test")return test();if(state.mode==="done")return done()}
function home(){app.innerHTML='<section class="card"><div class="over">Szófajok felelevenítése</div><h2>Ismered már az igeneveket? Próbáld ki!</h2><p>Az öt igenévfajtát kell felismerned, de igék, főnevek és melléknevek is szerepelnek. Figyeld a kiemelt szót és a mondatot is!</p><div class="list"><div><h3>1. Gyakorlás</h3><p>16 példa, azonnali segítség, nincs pontlevonás.</p><button class="primary" id="firstStage">Gyakorlás indítása</button></div><div><h3>2. Ige vagy főnévi igenév?</h3><p>12 célzott összehasonlítás személyragos alakokkal és feltételes módú igékkel.</p><button class="primary" id="secondStage">Célzott gyakorlás indítása</button></div><div><h3>3. Tudáspróba</h3><p>24 példa, színes választómenü, az első ellenőrzés 24 pontot ér.</p><button class="primary" id="thirdStage">Tudáspróba indítása</button></div></div><p class="note">Böngészőben gyakorlásra, Moodle SCORM 1.2-ben pedig pontozott feladatként is használható.</p></section>';document.getElementById("firstStage").onclick=newPractice;document.getElementById("secondStage").onclick=newContrast;document.getElementById("thirdStage").onclick=newTest}
function practice(){const i=state.order[state.at];if(i===undefined){state.mode="home";save();return home()}const q=bank[i];app.innerHTML='<section class="card"><div class="over">Gyakorlás · '+(state.at+1)+' / '+state.order.length+'</div><div class="bar"><div style="width:'+Math.round(state.at/state.order.length*100)+'%"></div></div><h2>Milyen szófajú a kiemelt szó?</h2><div class="sentence">'+textOf(i)+'</div><div class="options">'+cats.map(cat=>'<button class="option" data-cat="'+esc(cat)+'" style="background:'+colors[cat]+'">'+esc(cat)+'</button>').join("")+'</div><div id="feedback" aria-live="polite"></div></section>';document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{const cat=b.dataset.cat;if(cat===q[3]){document.querySelectorAll(".option").forEach(x=>x.disabled=true);document.getElementById("feedback").innerHTML='<div class="feedback"><strong>Helyes!</strong> '+esc(q[4])+'</div><div class="actions"><button class="primary" id="next">'+(state.at===state.order.length-1?"Ige vagy főnévi igenév?":"Következő →")+'</button></div>';document.getElementById("next").onclick=()=>{state.at++;state.miss=0;save();if(state.at>=state.order.length)newContrast();else render()}}else{state.miss++;save();document.getElementById("feedback").innerHTML='<div class="feedback warn"><strong>Gondold át újra!</strong> '+(state.miss>=2?'A helyes kategória: <strong>'+esc(q[3])+'</strong>. '+esc(q[4]):'Figyeld meg a kiemelt szó képzőjét és a mondatbeli szerepét!')+'</div>'}})}
function drawContrast(){
 const i=state.order[state.at],q=contrast[i];if(!q){newTest();return}
 app.innerHTML='<section class="card"><div class="over">Célzott gyakorlás · '+(state.at+1)+' / '+state.order.length+'</div><div class="bar"><div style="width:'+Math.round(state.at/state.order.length*100)+'%"></div></div><h2>Ige vagy főnévi igenév?</h2><p class="muted">Figyeld a mondatot és a kiemelt szóalakot! A főnévi igenév személyragot is kaphat.</p><div class="sentence">'+esc(q[0])+'<mark>'+esc(q[1])+'</mark>'+esc(q[2])+'</div><div class="options" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="option" data-cat="ige" style="background:'+colors.ige+'">Ige (feltételes mód)</button><button class="option" data-cat="főnévi igenév" style="background:'+colors["főnévi igenév"]+'">Főnévi igenév (személyragos is lehet)</button></div><div id="feedback" aria-live="polite"></div></section>';
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{if(b.dataset.cat===q[3]){document.querySelectorAll("[data-cat]").forEach(x=>x.disabled=true);document.getElementById("feedback").innerHTML='<div class="feedback"><strong>Helyes!</strong> '+esc(q[4])+'</div><div class="actions"><button class="primary" id="next">Következő →</button></div>';document.getElementById("next").onclick=()=>{state.at++;state.miss=0;save();if(state.at>=state.order.length)newTest();else render()}}else{state.miss++;save();document.getElementById("feedback").innerHTML='<div class="feedback warn"><strong>Még nem!</strong> '+(state.miss>=2?'A helyes válasz: <strong>'+esc(q[3])+'</strong>. '+esc(q[4]):'Gondold át: a kell mellett álló személyragos alakot látod, vagy önálló feltételes módú igét?')+'</div>'}})}
function test(){const count=Object.keys(state.answers).length;app.innerHTML='<section class="card"><div class="over">Pontozott tudáspróba · 24 pont</div><h2>Válaszd ki a kiemelt szó szófaját!</h2><p class="hint">Kattints a mondatra, majd a megjelenő színkódolt menüből válassz szófajt.</p><p><span class="chip">Besorolva: '+count+'/24</span>'+(state.score!==null?'<span class="chip">Első eredmény: '+state.score+'/24</span>':'')+'</p><div class="tiles">'+state.order.map((i,n)=>{let choice=state.answers[n],wrong=state.checked&&choice!==bank[i][3];return '<button class="tile '+(wrong?'error':'')+'" data-i="'+n+'"><span>'+textOf(i)+'</span>'+(choice?'<span class="tag" style="background:'+colors[choice]+'">'+esc(choice)+'</span>':'<span class="muted">Válassz szófajt ▾</span>')+'</button>'}).join("")+'</div><div class="actions">'+(!state.checked?'<button class="primary" id="check" '+(count!==24?'disabled':'')+'>Első ellenőrzés – pontozás</button>':'<button class="primary" id="end">Javítás befejezése</button><button id="solutions">Megoldások és indoklások</button>')+'</div><div id="feedback"></div></section>';document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>choose(b,Number(b.dataset.i)));if(!state.checked){document.getElementById("check").onclick=()=>{state.score=state.order.reduce((n,i,k)=>n+(state.answers[k]===bank[i][3]?1:0),0);state.checked=true;save();if(scorm&&scorm.isConnected)scorm.setScore(state.score);render()}}else{const errors=state.order.filter((i,k)=>state.answers[k]!==bank[i][3]).length;document.getElementById("feedback").innerHTML='<div class="feedback '+(errors?'warn':'')+'">Első pontszámod: <strong>'+state.score+'/24</strong>. '+(errors?'Még '+errors+' hibás besorolás van. Javíthatod őket; a pontszám már nem változik.':'Minden besorolás helyes!')+'</div>';document.getElementById("end").onclick=()=>{state.mode="done";save();if(scorm&&scorm.isConnected)scorm.complete(compact(state),state.score);render()};document.getElementById("solutions").onclick=()=>{document.getElementById("feedback").innerHTML='<div class="feedback"><h3>Megoldások</h3>'+state.order.map(i=>'<div class="review">'+textOf(i)+'<p><strong>'+esc(bank[i][3])+'</strong> – '+esc(bank[i][4])+'</p></div>').join("")+'</div>'}}}
function choose(button,index){document.querySelectorAll(".popup").forEach(x=>x.remove());const el=document.createElement("div");el.className="popup";el.setAttribute("role","dialog");el.setAttribute("aria-label","Szófaj kiválasztása");el.innerHTML='<button class="close">✕ Bezárás</button><div class="popup-grid">'+cats.map(cat=>'<button data-cat="'+esc(cat)+'" style="background:'+colors[cat]+'">'+esc(cat)+'</button>').join("")+'</div>';document.body.appendChild(el);const rect=button.getBoundingClientRect();el.style.left=Math.min(Math.max(10,rect.left),Math.max(10,innerWidth-350))+'px';el.style.top=(innerHeight-rect.bottom>370?rect.bottom+5:Math.max(10,rect.top-410))+'px';el.querySelector(".close").onclick=()=>el.remove();el.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.answers[index]=b.dataset.cat;save();el.remove();render()});el.querySelector("[data-cat]").focus()}
function done(){app.innerHTML='<section class="card"><div class="over">Tudáspróba lezárva</div><h2>Az eredményed</h2><div class="score">'+state.score+'/24</div><p>Az első ellenőrzés pontszáma számít. Köszönjük a munkádat!</p>'+(scorm&&scorm.isConnected?'<p class="feedback">A Moodle-próbálkozás befejeződött. Új próbálkozást a Moodle-ban indíthatsz.</p>':'<div class="actions"><button id="again" class="primary">Új tudáspróba</button><button id="learn">Gyakorlás újra</button></div>')+'</section>';if(!(scorm&&scorm.isConnected)){document.getElementById("again").onclick=newTest;document.getElementById("learn").onclick=newPractice}}
document.getElementById("home").onclick=()=>{state.mode="home";save();render()};
document.getElementById("practice").onclick=newPractice;
document.getElementById("contrast").onclick=newContrast;
document.getElementById("test").onclick=newTest;
start();
</script></body></html>
