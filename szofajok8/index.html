<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szófajok – 8. osztály – szófajtani gyakorlás</title>
<style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#203247;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#24577b,#327c89);color:#fff;padding:25px max(18px,calc((100vw - 1060px)/2))}h1{margin:0;font-size:clamp(1.7rem,4vw,2.3rem)}header p{margin:8px 0 0;color:#e8f6f7}main{max-width:1060px;margin:24px auto;padding:0 16px 50px}.card{background:white;border-radius:20px;box-shadow:0 8px 32px #193b5a12;padding:clamp(17px,3vw,30px);margin-bottom:18px}h2{margin-top:7px}.over{font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:.83rem;color:#327c89}.muted{color:#63758a}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:12px 16px;background:#eaf2f7;color:#234a69;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #edaa35;outline-offset:2px}.primary{background:#24759a;color:white}.bar{background:#e9eff4;height:10px;border-radius:100px;overflow:hidden;margin:15px 0 25px}.bar div{background:#23a68a;height:100%}.sentence{background:#eaf3fb;border-radius:15px;padding:26px 15px;text-align:center;font-size:clamp(1.45rem,3.5vw,2.2rem);line-height:1.5;font-weight:600;margin:18px 0}mark{background:#fbe399;padding:3px 6px;border-radius:7px;color:#253449}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.option{min-height:65px;color:white;border:3px solid transparent;padding:11px 8px}.option[data-cat="névmás"]{color:#17202a}.option:focus,.option:hover{border-color:#22374a}.feedback{padding:16px;border-radius:12px;background:#e7f6ed;color:#155b3d;margin-top:16px;line-height:1.5}.feedback.warn{background:#fff1d8;color:#76520c}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:#fffaf0;border:2px solid #e3d6b5;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:105px}.tile:hover{border-color:#357da6}.tile.error{border-color:#d0645f;background:#ffece9}.tile mark{background:#fae3a1}.tag{border-radius:7px;color:white;font-size:.81rem;display:inline-block;padding:5px 9px;align-self:flex-start}.tag[data-cat="névmás"]{color:#17202a}.chip{display:inline-block;background:#e9f1f8;border-radius:100px;padding:9px 13px;font-weight:700;margin-right:8px}.popup-overlay{position:fixed;inset:0;z-index:80;background:#142b4570;display:flex;align-items:center;justify-content:center;padding:12px}.popup{width:min(450px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;background:white;border:2px solid #a5c3d6;border-radius:16px;padding:12px;box-shadow:0 20px 50px #142b4555}.popup-grid button{overflow-wrap:anywhere}@media(max-width:450px){.popup-overlay{padding:8px}.popup{max-height:calc(100dvh - 16px);padding:10px}.popup-grid{gap:6px}.popup-grid button{min-height:48px;font-size:.8rem;padding:8px 5px}}.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.popup-grid button{color:white;font-size:.87rem;min-height:54px}.popup-grid button[data-cat="névmás"]{color:#17202a}.close{display:block;margin-left:auto;margin-bottom:8px;padding:7px 12px}.review{padding:13px 0;border-bottom:1px solid #e6edf4}.review:last-child{border-bottom:0}.score{font-size:3rem;color:#287d92;font-weight:800}.nav{margin-top:15px;display:flex;gap:9px;flex-wrap:wrap}.nav button{background:#e4f0f8}.note{font-size:.91rem;color:#63758a}.hint{border-left:4px solid #3b90b6;padding-left:12px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.list>div{background:#edf4f9;border-radius:12px;padding:15px}@media(max-width:790px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.options{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.tiles,.list{grid-template-columns:1fr}}@media print{header{color:#222;background:white}.nav,.actions{display:none}}
</style></head><body><header><h1>Szófajok – 8. osztály</h1><p>Tizenkét szófaji kategória – gyakorlás és önálló tudáspróba</p><div class="nav"><button id="home">Kezdőlap</button><button id="practice">Gyakorlás</button><button id="test">Tudáspróba</button></div></header><main id="app"></main>
<script src="scorm-runtime.js"></script>
<script>
"use strict";
const cats=["ige","főnév","melléknév","számnév","névmás","főnévi igenév","névelő","névutó","határozószó","igekötő","kötőszó","módosítószó"];
const colors={"ige":"#8E44AD","főnév":"#007E8C","melléknév":"#E67E22","számnév":"#C0392B","névmás":"#F1C40F","főnévi igenév":"#27AE60","névelő":"#7F8C8D","névutó":"#66747a","határozószó":"#2980B9","igekötő":"#6258ac","kötőszó":"#bd5d8f","módosítószó":"#8b6b33"};
const bank=[["A gyerekek ","futnak"," az udvaron.","ige","Ragozott ige: a gyerekek cselekvését fejezi ki."],["Én szívesen ","olvasnék"," még.","ige","Feltételes módú, ragozott ige."],["A tanár ","kinyitotta"," az ablakot.","ige","Múlt idejű ragozott ige."],["Ezt a levelet holnap ","megírnám",".","ige","Feltételes módú ige; a meg- igekötő itt az igével egybeírt."],["Holnap jó idő ","lesz",".","ige","A lesz a létige ragozott alakja."],["A gyerek a ","kertben"," játszik.","főnév","A kert főnév -ben határozóraggal; a mondatban helyhatározó."],["Az ","öröm"," mindenkinek látszott az arcán.","főnév","Elvont fogalmat megnevező főnév."],["A ","hídon"," sok autó halad.","főnév","A híd főnév -on raggal; attól még főnév marad."],["A ","tanuló"," kérdezett.","főnév","Itt személyt nevez meg, főnévként használjuk."],["A család ","Budapestre"," utazott.","főnév","Budapest tulajdonnév -re raggal."],["A ","kedves"," szomszéd segített.","melléknév","Tulajdonságot fejez ki."],["A ","piros"," sál eltűnt.","melléknév","Színt, tulajdonságot jelöl."],["Ez ","nagyszerű"," ötlet!","melléknév","Tulajdonságot jelölő melléknév."],["A ","bátor"," fiú előrelépett.","melléknév","Tulajdonságot nevez meg."],["A ","csendes"," teremben dolgoztunk.","melléknév","Milyen terem? A csendes melléknév."],["Az osztályból ","öt"," gyerek jelentkezett.","számnév","Határozott mennyiséget jelöl."],["A ","második"," versszakot tanuljuk.","számnév","Sorrendet jelölő sorszámnév."],["A csapat ","kettő"," pontot szerzett.","számnév","Mennyiséget jelölő számnév."],["A ","negyed"," rész maradt meg.","számnév","Törtszámnév."],["Pontosan ","száz"," oldalból áll.","számnév","Határozott mennyiséget jelöl."],["Azt mondta, hogy ","ő"," már készen van.","névmás","Személyes névmás, főnév helyett áll."],["Én ","ilyen"," cipőt szeretnék.","névmás","Mutató névmás, tulajdonságra utal."],["Az ajtón ","valaki"," kopogott.","névmás","Határozatlan névmás, személyre utal."],["Azok, ","akik"," elkészültek, indulhatnak.","névmás","Vonatkozó névmás."],["A feladatot ","mindenki"," megoldotta.","névmás","Általános névmás."],["Szeretek ","olvasni"," esténként.","főnévi igenév","A -ni képzős alak főnévi igenév."],["Nekem most ","ennem"," kell.","főnévi igenév","Az ennem személyragos főnévi igenév, nem feltételes módú ige."],["Nektek időben ","mennetek"," kell.","főnévi igenév","A mennetek személyragos főnévi igenév."],["Neki kell ","írnia"," egy levelet.","főnévi igenév","Az írnia személyragos főnévi igenév."],["Érdemes lenne ","megpróbálni"," újra.","főnévi igenév","A -ni képzőből felismerhető főnévi igenév."],["","Az"," iskola előtt találkozunk.","névelő","Az iskola főnév előtt álló határozott névelő."],["","A"," könyv az asztalon van.","névelő","A könyv előtt álló határozott névelő."],["Láttam ","a"," filmet tegnap.","névelő","A film főnév előtt álló határozott névelő."],["Megérkezett ","az"," autóbusz.","névelő","Az autóbusz főnév előtt álló határozott névelő."],["Keresem ","a"," kulcsomat.","névelő","A kulcsomat előtt álló határozott névelő."],["A ház ","mellett"," várakoztunk.","névutó","A ház főnév után álló névutó."],["Az óra ","után"," indulunk.","névutó","Viszonyt jelölő névutó."],["Az iskola ","előtt"," találkozunk.","névutó","A főnév után álló névutó."],["A két épület ","között"," van a park.","névutó","Helyviszonyt jelölő névutó."],["A város ","felé"," indultak.","névutó","Irányt jelölő névutó."],["A futó ","gyorsan"," haladt.","határozószó","A cselekvés módját fejezi ki: hogyan?"],["","Itt"," találkozunk holnap.","határozószó","Helyet jelölő határozószó."],["","Azonnal"," indulnunk kell.","határozószó","Időviszonyt jelölő határozószó."],["A gyerekek ","kint"," játszanak.","határozószó","Helyet jelölő határozószó."],["","Holnap"," kezdődik a verseny.","határozószó","Időt jelölő határozószó."],["","Meg"," fogom írni a levelet.","igekötő","Az igekötő elválik az igétől: meg fogom írni."],["","El"," akarunk menni.","igekötő","Az el igekötő az akarunk miatt elválik a menni igétől."],["","Ki"," fog nyílni az ajtó.","igekötő","A ki igekötő elválik a nyílni igétől."],["","Be"," kell mennetek.","igekötő","A be igekötő a mennetek főnévi igenévhez tartozik."],["","Vissza"," fog jönni holnap.","igekötő","A vissza igekötő a jönni főnévi igenévhez tartozik."],["Anya ","és"," apa is eljött.","kötőszó","Az és mondatrészeket, szavakat kapcsol össze."],["Otthon maradtam, ","mert"," esett.","kötőszó","A mert okot kifejező mellékmondatot kapcsol."],["Indultam volna, ","de"," elkéstem.","kötőszó","Az ellentétet jelző kötőszó."],["Elmegyünk, ","ha"," nem esik.","kötőszó","Feltételes mellékmondatot kapcsol."],["Teát ","vagy"," vizet kérsz?","kötőszó","Választást kifejező kötőszó."],["","Talán"," holnap megérkezik.","módosítószó","A beszélő bizonytalanságát fejezi ki."],["","Vajon"," sikerül a feladat?","módosítószó","Kérdő attitűdöt kifejező módosítószó."],["","Bizonyára"," igazad van.","módosítószó","A beszélő feltételezését fejezi ki."],["","Aligha"," érünk oda időben.","módosítószó","A kijelentés valószínűségét módosítja."],["","Persze"," szívesen segítek.","módosítószó","A beszélő állásfoglalását fejezi ki."]];
const key="szofajok8-v1",app=document.getElementById("app");
const scorm=window.SzofajSCORM;
let state;
function shuffled(items){let a=items.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}
function textOf(i){const q=bank[i];return esc(q[0])+'<mark>'+esc(q[1])+'</mark>'+esc(q[2])}
function wordOf(i){const q=bank[i];return esc((q[0]+q[1]+q[2]).trim())}
function compact(s){
 return {v:1,m:s.mode,o:s.order||null,i:s.at||0,miss:s.miss||0,
 a:Object.entries(s.answers||{}).map(([i,v])=>[Number(i),cats.indexOf(v)]),
 sc:s.score,chk:s.checked?1:0};
}
function expand(s){
 if(!s||s.v!==1||!["home","practice","contrast","test","done"].includes(s.m))return null;
 return {mode:s.m,order:s.o||null,at:s.i||0,miss:s.miss||0,
 answers:Object.fromEntries((s.a||[]).map(([i,j])=>[i,cats[j]])),
 score:s.sc===undefined?null:s.sc,checked:!!s.chk};
}
function save(){
 if(scorm&&scorm.isConnected){scorm.saveState(compact(state));return}
 try{localStorage.setItem(key,JSON.stringify(state))}catch{}
}
function load(){
 if(scorm&&scorm.isConnected)return expand(scorm.loadState());
 try{return JSON.parse(localStorage.getItem(key))}catch{return null}
}
function indices(first){return shuffled(bank.map((_,i)=>i).filter(i=>first?i%5<2:i%5>=2))}
function canRestart(){return !(scorm&&scorm.isConnected&&state&&state.mode==="done")}
function newPractice(){if(!canRestart())return;state={mode:"practice",order:indices(true),at:0,miss:0,reveal:false,answers:{},score:null};save();render()}
function newTest(){if(!canRestart())return;state={mode:"test",order:indices(false),at:0,miss:0,reveal:false,answers:{},score:null,checked:false};save();render()}
function start(){state=load();if(!state||!state.mode)state={mode:"home"};if(!(scorm&&scorm.isConnected)&&new URLSearchParams(location.search).get("test")==="1")newTest();else render()}
function render(){if(scorm&&scorm.isConnected&&state.mode==="done")document.querySelectorAll(".nav button").forEach(b=>b.disabled=true);if(state.mode==="home")return home();if(state.mode==="practice")return practice();if(state.mode==="test")return test();if(state.mode==="done")return done()}
function home(){app.innerHTML='<section class="card"><div class="over">8. évfolyam · haladó szófajfelismerés</div><h2>Mennyire ismered a szófajokat?</h2><p>Tizenkét szófaji kategóriából választasz. Figyeld a mondatot és a kiemelt szót is: a mondatrész nem azonos a szófajjal!</p><div class="list"><div><h3>1. Gyakorlás</h3><p>24 példa, mind a 12 kategóriával, segítséggel és pontlevonás nélkül.</p><button class="primary" id="firstStage">Gyakorlás indítása</button></div><div><h3>2. Tudáspróba</h3><p>36 feladat; minden szófajból három, első ellenőrzésre pontozva.</p><button class="primary" id="thirdStage">Tudáspróba indítása</button></div></div><p class="note">Moodle SCORM 1.2 környezetben a 36 pontos tudáspróba eredménye kerül rögzítésre.</p></section>';document.getElementById("firstStage").onclick=newPractice;document.getElementById("thirdStage").onclick=newTest}
function practice(){const i=state.order[state.at];if(i===undefined){state.mode="home";save();return home()}const q=bank[i];app.innerHTML='<section class="card"><div class="over">Gyakorlás · '+(state.at+1)+' / '+state.order.length+'</div><div class="bar"><div style="width:'+Math.round(state.at/state.order.length*100)+'%"></div></div><h2>Milyen szófajú a kiemelt szó?</h2><div class="sentence">'+textOf(i)+'</div><div class="options">'+cats.map(cat=>'<button class="option" data-cat="'+esc(cat)+'" style="background:'+colors[cat]+'">'+esc(cat)+'</button>').join("")+'</div><div id="feedback" aria-live="polite"></div></section>';document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{const cat=b.dataset.cat;if(cat===q[3]){document.querySelectorAll(".option").forEach(x=>x.disabled=true);document.getElementById("feedback").innerHTML='<div class="feedback"><strong>Helyes!</strong> '+esc(q[4])+'</div><div class="actions"><button class="primary" id="next">'+(state.at===state.order.length-1?"Tudáspróba következik":"Következő →")+'</button></div>';document.getElementById("next").onclick=()=>{state.at++;state.miss=0;save();if(state.at>=state.order.length)newTest();else render()}}else{state.miss++;save();document.getElementById("feedback").innerHTML='<div class="feedback warn"><strong>Gondold át újra!</strong> '+(state.miss>=2?'A helyes kategória: <strong>'+esc(q[3])+'</strong>. '+esc(q[4]):'Figyeld meg a kiemelt szó képzőjét és a mondatbeli szerepét!')+'</div>'}})}
function test(){const count=Object.keys(state.answers).length;app.innerHTML='<section class="card"><div class="over">Pontozott tudáspróba · 36 pont</div><h2>Válaszd ki a kiemelt szó szófaját!</h2><p class="hint">Kattints a mondatra, majd a megjelenő színkódolt menüből válassz szófajt.</p><p><span class="chip">Besorolva: '+count+'/36</span>'+(state.score!==null?'<span class="chip">Első eredmény: '+state.score+'/36</span>':'')+'</p><div class="tiles">'+state.order.map((i,n)=>{let choice=state.answers[n],wrong=state.checked&&choice!==bank[i][3];return '<button class="tile '+(wrong?'error':'')+'" data-i="'+n+'"><span>'+textOf(i)+'</span>'+(choice?'<span class="tag" style="background:'+colors[choice]+'">'+esc(choice)+'</span>':'<span class="muted">Válassz szófajt ▾</span>')+'</button>'}).join("")+'</div><div class="actions">'+(!state.checked?'<button class="primary" id="check" '+(count!==36?'disabled':'')+'>Első ellenőrzés – pontozás</button>':'<button class="primary" id="end">Javítás befejezése</button><button id="solutions">Megoldások és indoklások</button>')+'</div><div id="feedback"></div></section>';document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>choose(b,Number(b.dataset.i)));if(!state.checked){document.getElementById("check").onclick=()=>{state.score=state.order.reduce((n,i,k)=>n+(state.answers[k]===bank[i][3]?1:0),0);state.checked=true;save();if(scorm&&scorm.isConnected)scorm.setScore(state.score);render()}}else{const errors=state.order.filter((i,k)=>state.answers[k]!==bank[i][3]).length;document.getElementById("feedback").innerHTML='<div class="feedback '+(errors?'warn':'')+'">Első pontszámod: <strong>'+state.score+'/36</strong>. '+(errors?'Még '+errors+' hibás besorolás van. Javíthatod őket; a pontszám már nem változik.':'Minden besorolás helyes!')+'</div>';document.getElementById("end").onclick=()=>{state.mode="done";save();if(scorm&&scorm.isConnected)scorm.complete(compact(state),state.score);render()};document.getElementById("solutions").onclick=()=>{document.getElementById("feedback").innerHTML='<div class="feedback"><h3>Megoldások</h3>'+state.order.map(i=>'<div class="review">'+textOf(i)+'<p><strong>'+esc(bank[i][3])+'</strong> – '+esc(bank[i][4])+'</p></div>').join("")+'</div>'}}}
function choose(button,index){document.querySelectorAll(".popup-overlay").forEach(x=>x.remove());const overlay=document.createElement("div");overlay.className="popup-overlay";const el=document.createElement("div");el.className="popup";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Szófaj kiválasztása");el.innerHTML='<button class="close">✕ Bezárás</button><div class="popup-grid">'+cats.map(cat=>'<button data-cat="'+esc(cat)+'" style="background:'+colors[cat]+'">'+esc(cat)+'</button>').join("")+'</div>';overlay.appendChild(el);document.body.appendChild(overlay);const close=()=>{overlay.remove();button.focus()};el.querySelector(".close").onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};overlay.onkeydown=e=>{if(e.key==="Escape"){e.preventDefault();close()}else if(e.key==="Tab"){const focusable=[...el.querySelectorAll("button")];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};el.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.answers[index]=b.dataset.cat;save();overlay.remove();render()});el.querySelector("[data-cat]").focus()}
function done(){app.innerHTML='<section class="card"><div class="over">Tudáspróba lezárva</div><h2>Az eredményed</h2><div class="score">'+state.score+'/36</div><p>Az első ellenőrzés pontszáma számít. Köszönjük a munkádat!</p>'+(scorm&&scorm.isConnected?'<p class="feedback">A Moodle-próbálkozás befejeződött. Új próbálkozást a Moodle-ban indíthatsz.</p>':'<div class="actions"><button id="again" class="primary">Új tudáspróba</button><button id="learn">Gyakorlás újra</button></div>')+'</section>';if(!(scorm&&scorm.isConnected)){document.getElementById("again").onclick=newTest;document.getElementById("learn").onclick=newPractice}}
document.getElementById("home").onclick=()=>{state.mode="home";save();render()};
document.getElementById("practice").onclick=newPractice;
document.getElementById("test").onclick=newTest;
start();
</script></body></html>
